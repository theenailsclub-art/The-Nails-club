<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Wishlist | The Nails Club</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="designs-data.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'DM Sans', sans-serif; background: #FAF8F5; color: #322C2C; -webkit-font-smoothing: antialiased; }

/* ── HEADER ── */
header {
  position: sticky; top: 0; z-index: 50;
  background: rgba(255,255,255,0.95); backdrop-filter: blur(10px);
  border-bottom: 1px solid rgba(50,44,44,0.08);
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 28px;
}
header a { text-decoration: none; }
.nav-links { display: flex; gap: 28px; align-items: center; }
.nav-links a { font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: rgba(50,44,44,0.55); transition: color 0.2s; }
.nav-links a:hover { color: #322C2C; }

/* ── WISHLIST ICON BADGE ── */
.wl-icon-wrap { position: relative; display: flex; align-items: center; }
.wl-count-badge {
  position: absolute; top: -6px; right: -6px;
  background: #BC1423; color: #fff;
  font-size: 9px; font-weight: 700; font-family: 'DM Sans', sans-serif;
  width: 16px; height: 16px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  pointer-events: none;
}

/* ── PAGE ── */
.page-wrap { max-width: 1200px; margin: 0 auto; padding: 48px 24px 80px; }

.page-header { margin-bottom: 40px; border-bottom: 1px solid rgba(50,44,44,0.1); padding-bottom: 24px; }
.page-header h1 { font-family: 'Cormorant Garamond', serif; font-size: clamp(2rem, 5vw, 3.2rem); font-weight: 400; letter-spacing: -0.01em; }
.page-header p  { font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(50,44,44,0.4); margin-top: 6px; }

/* ── GRID ── */
.wl-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 24px;
}

/* ── CARD ── */
.wl-card {
  background: #fff; border-radius: 16px; overflow: hidden;
  box-shadow: 0 2px 16px rgba(50,44,44,0.07);
  transition: transform 0.25s ease, box-shadow 0.25s ease;
  cursor: pointer; position: relative;
}
.wl-card:hover { transform: translateY(-4px); box-shadow: 0 10px 36px rgba(50,44,44,0.13); }

.wl-card-img {
  position: relative; aspect-ratio: 4/3; overflow: hidden; background: #f0ebe7;
}
.wl-card-img img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.5s ease; }
.wl-card:hover .wl-card-img img { transform: scale(1.06); }

.wl-remove-btn {
  position: absolute; top: 10px; right: 10px;
  width: 32px; height: 32px; border-radius: 50%;
  background: rgba(255,255,255,0.92); border: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  color: #BC1423; font-size: 15px;
  opacity: 0; transition: opacity 0.2s ease;
  z-index: 2;
}
.wl-card:hover .wl-remove-btn { opacity: 1; }

.wl-card-info { padding: 14px 16px 18px; }
.wl-card-cat  { font-size: 9px; letter-spacing: 0.18em; text-transform: uppercase; color: rgba(50,44,44,0.38); margin-bottom: 4px; }
.wl-card-name { font-family: 'Cormorant Garamond', serif; font-size: 18px; font-weight: 500; line-height: 1.2; margin-bottom: 10px; }
.wl-card-price { font-family: 'Cormorant Garamond', serif; font-size: 17px; font-weight: 500; color: #BC1423; margin-bottom: 12px; }
.wl-card-btn {
  width: 100%; padding: 10px; border-radius: 10px;
  background: #322C2C; color: #fff; border: none; cursor: pointer;
  font-family: 'DM Sans', sans-serif; font-size: 10px;
  letter-spacing: 0.16em; text-transform: uppercase; font-weight: 600;
  transition: background 0.2s;
}
.wl-card-btn:hover { background: #BC1423; }

/* ── EMPTY STATE ── */
#wl-empty {
  display: none; text-align: center; padding: 80px 20px;
}
#wl-empty .empty-icon { font-size: 56px; margin-bottom: 20px; opacity: 0.25; }
#wl-empty h2 { font-family: 'Cormorant Garamond', serif; font-size: 2rem; font-weight: 400; margin-bottom: 8px; }
#wl-empty p  { font-size: 13px; color: rgba(50,44,44,0.5); margin-bottom: 24px; line-height: 1.6; }
#wl-empty a  {
  display: inline-block; padding: 13px 32px;
  background: #322C2C; color: #fff; border-radius: 99px; text-decoration: none;
  font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; font-weight: 600;
  transition: background 0.2s;
}
#wl-empty a:hover { background: #BC1423; }

/* ── CLEAR BTN ── */
#wl-clear-btn {
  display: none; margin-top: 40px; padding: 11px 28px;
  border: 1.5px solid rgba(50,44,44,0.2); border-radius: 99px;
  background: none; cursor: pointer; font-family: 'DM Sans', sans-serif;
  font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase;
  color: rgba(50,44,44,0.5); transition: all 0.2s;
}
#wl-clear-btn:hover { border-color: #BC1423; color: #BC1423; }

/* ── TOAST ── */
#wl-toast {
  position: fixed; bottom: 28px; left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: #322C2C; color: #fff; padding: 11px 22px;
  border-radius: 99px; font-size: 12px; opacity: 0;
  pointer-events: none; transition: all 0.25s ease;
  z-index: 9999; white-space: nowrap;
  box-shadow: 0 4px 20px rgba(0,0,0,0.2);
}
#wl-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>

<body>

<!-- HEADER -->
<header>
  <a href="index.html">
    <img src="logo.png" alt="The Nails Club" style="height:34px;width:auto;object-fit:contain;">
  </a>
  <nav class="nav-links">
    <a href="index.html#collection">Collection</a>
    <a href="index.html#reels">Reels</a>
    <a href="index.html#about">About</a>
  </nav>
  <div style="display:flex;align-items:center;gap:16px;">
    <!-- Wishlist icon (active — we're on this page) -->
    <a href="wishlist.html" class="wl-icon-wrap" title="My Wishlist" style="color:#BC1423;">
      <svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" style="display:inline-block;vertical-align:middle;"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
      <span id="header-wl-count" class="wl-count-badge" style="display:none;"></span>
    </a>
    <a href="index.html" style="font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:rgba(50,44,44,0.5);text-decoration:none;">Home</a>
  </div>
</header>

<!-- PAGE -->
<main class="page-wrap">

  <div class="page-header">
    <h1>My Wishlist <svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" style="display:inline-block;vertical-align:middle;"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg></h1>
    <p id="wl-count-label">0 saved designs</p>
  </div>

  <!-- Grid -->
  <div id="wl-grid" class="wl-grid"></div>

  <!-- Empty state -->
  <div id="wl-empty">
    <div class="empty-icon">🩷</div>
    <h2>Your wishlist is empty</h2>
    <p>Browse our collection and tap "Add to Wishlist"<br>on any design you love.</p>
    <a href="index.html#collection">Browse Collection →</a>
  </div>

  <!-- Clear all -->
  <div style="text-align:center;">
    <button id="wl-clear-btn" onclick="clearWishlist()">Clear all</button>
  </div>

</main>

<!-- TOAST -->
<div id="wl-toast"></div>

<script>
const WISHLIST_KEY = 'tnc_wishlist';

function getWishlist() {
  try { return JSON.parse(localStorage.getItem(WISHLIST_KEY) || '[]'); } catch(e) { return []; }
}
function saveWishlist(list) {
  try { localStorage.setItem(WISHLIST_KEY, JSON.stringify(list)); } catch(e) {}
}

function showToast(msg) {
  const t = document.getElementById('wl-toast');
  if (!t) return;
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 2200);
}

function removeItem(idx) {
  let wl = getWishlist();
  wl = wl.filter(item => item.idx !== idx);
  saveWishlist(wl);
  renderWishlist();
  showToast('Removed from Wishlist');
}

function clearWishlist() {
  saveWishlist([]);
  renderWishlist();
  showToast('Wishlist cleared');
}

function renderWishlist() {
  const wl = getWishlist();
  const grid   = document.getElementById('wl-grid');
  const empty  = document.getElementById('wl-empty');
  const clearBtn = document.getElementById('wl-clear-btn');
  const label  = document.getElementById('wl-count-label');
  const headerBadge = document.getElementById('header-wl-count');

  // Update count label
  if (label) label.textContent = wl.length + ' saved design' + (wl.length !== 1 ? 's' : '');
  if (headerBadge) {
    if (wl.length > 0) { headerBadge.textContent = wl.length; headerBadge.style.display = 'flex'; }
    else headerBadge.style.display = 'none';
  }

  if (!grid) return;
  grid.innerHTML = '';

  if (wl.length === 0) {
    if (empty) empty.style.display = 'block';
    if (clearBtn) clearBtn.style.display = 'none';
    return;
  }

  if (empty) empty.style.display = 'none';
  if (clearBtn) clearBtn.style.display = 'inline-block';

  wl.forEach(function(item) {
    // Get latest design data from DESIGNS array if available
    const design = (typeof DESIGNS !== 'undefined' && DESIGNS[item.idx]) ? DESIGNS[item.idx] : item;
    const imgSrc = encodeImgPath(design.photos ? design.photos[0] : (item.img || ''));
    const catName = (typeof catLabels !== 'undefined' && design.cat) ? (catLabels[design.cat] || design.cat) : (item.cat || '');

    const card = document.createElement('div');
    card.className = 'wl-card';
    card.onclick = function(e) {
      if (e.target.closest('.wl-remove-btn')) return;
      window.location.href = 'premium_product_page.html?design=' + item.idx;
    };

    card.innerHTML =
      '<div class="wl-card-img">' +
        '<img src="' + imgSrc + '" alt="' + (design.title || item.title) + '" onerror="this.style.opacity=\'0.3\'">' +
        '<button class="wl-remove-btn" title="Remove from wishlist" onclick="removeItem(' + item.idx + ')">' +
          '<svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" style="display:inline-block;vertical-align:middle;"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>' +
        '</button>' +
      '</div>' +
      '<div class="wl-card-info">' +
        '<p class="wl-card-cat">' + catName + '</p>' +
        '<p class="wl-card-name">' + (design.title || item.title) + '</p>' +
        '<p class="wl-card-price">₹' + (design.price || item.price || 999) + '</p>' +
        '<button class="wl-card-btn" onclick="event.stopPropagation();window.location.href=\'premium_product_page.html?design=' + item.idx + '\'">View Design</button>' +
      '</div>';

    grid.appendChild(card);
  });
}

// Run on load
document.addEventListener('DOMContentLoaded', async () => {
  if (window.DESIGNS_READY) { try { await window.DESIGNS_READY; } catch(e) {} }
  renderWishlist();
});
</script>

</body>
</html>
